# riddlc options for To Doodles
#
# The 'hugo' command and its options were removed in RIDDL 2.0; document
# generation now lives in the riddl-gen project. Warning suppression has also
# been removed here on purpose: this corpus is meant to validate with zero
# errors, deprecations, missing and completeness warnings, so hiding them
# would defeat the point.
common {
  show-times = false
  verbose = false
  quiet = false
  dry-run = false
  show-warnings = true
  show-missing-warnings = true
  show-style-warnings = true
  show-usage-warnings = true
  show-completeness-warnings = true
  group-messages-by-kind = true
  provide-tips = true
}
parse {
  input-file = "ToDoodles.riddl"
}
validate {
  input-file = "ToDoodles.riddl"
}
stats {
  input-file = "ToDoodles.riddl"
}
